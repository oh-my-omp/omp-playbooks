# Every push to main gets its own patch version, written to package.json and
# tern-plugin/plugin.toml together. The extension compares plugin.toml with the version
# the Tern daemon loaded and reloads Tern's plugins when they differ, so this number is
# what makes an upgrade reach the running Tern side.
#
# The bump commit is pushed with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not
# start workflow runs, so it does not bump again.
name: bump-version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump patch version
        run: |
          set -euo pipefail
          current=$(perl -ne 'print $1 if /^\t"version": "(\d+\.\d+\.\d+)",$/' package.json)
          plugin=$(perl -ne 'print $1 if /^version = "(\d+\.\d+\.\d+)"$/' tern-plugin/plugin.toml)
          if [ -z "$current" ] || [ "$current" != "$plugin" ]; then
            echo "package.json version '$current' and tern-plugin/plugin.toml version '$plugin' must be the same X.Y.Z" >&2
            exit 1
          fi
          export CURRENT="$current" NEXT="${current%.*}.$(( ${current##*.} + 1 ))"
          perl -pi -e 's/^(\t"version": ")\Q$ENV{CURRENT}\E(",)$/$1$ENV{NEXT}$2/' package.json
          perl -pi -e 's/^(version = ")\Q$ENV{CURRENT}\E(")$/$1$ENV{NEXT}$2/' tern-plugin/plugin.toml
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $NEXT"
          git push origin HEAD:main
